version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_NAME:-capy_postgres}
    restart: always
    environment:
      POSTGRES_USER: capy
      POSTGRES_PASSWORD: capyplan
      POSTGRES_DB: capyplan_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
